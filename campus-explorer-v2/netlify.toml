# ============================================================
# Netlify 部署配置 — gaokaoschool
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"

# ============================================================
# AI API 代理 — 生产环境转发 /api/ai/* 到真实 API
# ============================================================
[[redirects]]
  from = "/api/ai/*"
  to = "https://dashscope.aliyuncs.com/:splat"
  status = 200
  force = true
