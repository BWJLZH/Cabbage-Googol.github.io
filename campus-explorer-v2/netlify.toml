# ============================================================
# Netlify 部署配置
# ============================================================

[build]
  command = "npm run build"        # 构建命令
  publish = "dist"                 # 发布目录（Vite 构建输出）

# ============================================================
# AI API 代理 — 生产环境替代 Vite 开发代理
#
# 原理：浏览器请求 /api/ai/* → Netlify 服务端转发到真实 API
#        浏览器看到的是同源请求，不存在跨域
#
# ★ 换了 API 提供商时，把 to 里的域名换成新的
# ============================================================
[[redirects]]
  from = "/api/ai/*"
  to = "https://dashscope.aliyuncs.com/:splat"
  status = 200
  force = true

# ============================================================
# SPA 路由 — 所有非文件请求回退到 index.html
# 当前使用 hash 路由理论上不需要，加上以防万一
# ============================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
